[package]
name = "operasional-automation-app"
version = "1.0.0"
description = "PT Bahana Security Sistem Operational Automation App"
authors = ["PT Bahana Security Sistem"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
