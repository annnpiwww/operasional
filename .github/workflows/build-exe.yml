name: Build Windows Desktop Executable (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web App Dist
        run: npm run build

      - name: Package Windows Executable Installer (.exe)
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact Windows (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: OperasionalAutomationApp-Windows-Setup
          path: dist-electron/*.exe
          if-no-files-found: warn

      - name: Create GitHub Release with .exe Installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 'Release v1.0.0 — Operasional Automation App (.exe)'
          body: 'File installer Windows (.exe) resmi untuk tim operasional SPV PT Bahana Security Sistem.'
          files: dist-electron/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
