name: Build Tauri Windows Executable (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App Dist
        run: npm run build

      - name: Build Standalone Windows Executable (.exe)
        run: npx @tauri-apps/cli build --no-bundle

      - name: Upload Executable Artifact (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: OperasionalAutomationApp-Windows-Exe
          path: |
            src-tauri/target/release/*.exe
          if-no-files-found: error
