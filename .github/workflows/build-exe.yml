name: Build Tauri Windows Executable (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm ci

      - name: Build Tauri App (.exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Release v__VERSION__'
          releaseBody: 'Release otomatisasi operasional Windows .exe installer'
          releaseDraft: true
          prerelease: false

      - name: Upload Artifact Executable
        uses: actions/upload-artifact@v4
        with:
          name: OperasionalAutomationApp-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
